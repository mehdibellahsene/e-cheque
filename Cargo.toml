[package]
name = "e-cheque"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Module de communication POS pour la lecture des données de chèque"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mehdibellahsene/e-cheque"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
mockall = "0.15.0"
